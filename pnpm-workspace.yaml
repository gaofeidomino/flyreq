packages:
  - packages/*
  - examples/*

# pnpm 11 fails the install on an undeclared build script rather than warning.
# esbuild arrives transitively under vitest and resolves its binary from the
# @esbuild/<platform> optional dep, so its postinstall is not needed.
allowBuilds:
  esbuild: false

catalog:
  typescript: ^5.8.3
  tsdown: ^0.12.9
  vitest: ^3.2.4
  axios: ^1.11.0
  '@types/node': ^22.15.21
